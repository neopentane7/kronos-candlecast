name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Torch is a ~2.5GB CUDA wheel and no CI runner has a GPU. Everything under
      # tests/ that needs it uses pytest.importorskip, so we skip installing it.
      - name: Sync dependencies (without torch)
        run: uv sync --all-groups --no-install-package torch

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v
