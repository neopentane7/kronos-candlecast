# Install once with: uv run pre-commit install
exclude: '^(phase-a/Kronos/|results/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # A PowerShell read/write round-trip has twice rewritten a Markdown file in the
  # system codepage, mangling en-dashes into "a<euro>" sequences. Caught by eye both
  # times, which is not a control.
  - repo: local
    hooks:
      - id: check-encoding
        name: utf-8 without BOM, and no double-encoding damage
        entry: python phase-a/scripts/check_encoding.py
        language: system
        types: [text]
